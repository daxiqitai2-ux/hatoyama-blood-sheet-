<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鳩山牧場 PRRS/CSF採血シート</title>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.3.0/dist/exceljs.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap');
  :root {
    --green:#1D9E75;--green-d:#0F6E56;--green-l:#E1F5EE;--green-xl:#F0FAF6;
    --text:#1a1a1a;--text-s:#555;--text-t:#999;--border:#e0e0e0;
    --bg:#f7f8f6;--card:#ffffff;--radius:10px;
    --danger:#c0392b;--danger-l:#fdf0ef;
    --amber:#d97706;--amber-l:#fef3c7;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
  header{background:var(--green);color:#fff;padding:16px 24px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.12)}
  header svg{width:24px;height:24px;flex-shrink:0}
  header h1{font-size:17px;font-weight:700;letter-spacing:.03em}
  header p{font-size:11px;opacity:.8;margin-top:1px}
  .main{max-width:720px;margin:0 auto;padding:20px 16px 40px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
  .card-title{font-size:12px;font-weight:700;color:var(--green-d);letter-spacing:.08em;text-transform:uppercase;padding-bottom:12px;margin-bottom:16px;border-bottom:1px solid var(--border)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .full{grid-column:1/-1}
  .fg{display:flex;flex-direction:column;gap:5px}
  label{font-size:11px;font-weight:700;color:var(--text-s);letter-spacing:.05em}
  select,input[type=date]{font-family:'Noto Sans JP',sans-serif;font-size:14px;padding:9px 12px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--text);width:100%;outline:none;transition:border-color .15s}
  select:focus,input[type=date]:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(29,158,117,.12)}
  .btn-group{display:flex;gap:6px;flex-wrap:wrap}
  .bs{font-family:'Noto Sans JP',sans-serif;font-size:13px;font-weight:500;padding:7px 14px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--text);cursor:pointer;transition:all .12s}
  .bs:hover{background:var(--green-xl);border-color:var(--green);color:var(--green-d)}
  .bs.on{background:var(--green);border-color:var(--green);color:#fff}
  .ear-disp{font-family:'IBM Plex Mono',monospace;font-size:24px;font-weight:500;letter-spacing:4px;padding:10px 14px;border:1px solid var(--border);border-radius:8px;background:var(--bg);min-height:50px;color:var(--text);margin-bottom:10px}
  .ear-ph{color:var(--text-t);font-size:14px;letter-spacing:0}
  .numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .nb{font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:500;padding:10px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--text);cursor:pointer;text-align:center;transition:all .1s;user-select:none}
  .nb:hover{background:var(--green-xl);border-color:var(--green)}
  .nb:active{transform:scale(.93);background:var(--green-l)}
  .nb.del{color:var(--danger);font-size:14px}
  .nb.del:hover{background:var(--danger-l);border-color:var(--danger)}
  .np-label{font-size:11px;font-weight:700;color:var(--text-s);letter-spacing:.05em;margin-bottom:6px}
  .age-badge{display:inline-flex;align-items:center;font-size:13px;font-weight:500;padding:7px 14px;border-radius:8px;background:var(--green-l);color:var(--green-d)}
  .add-btn{width:100%;padding:12px;font-family:'Noto Sans JP',sans-serif;font-size:15px;font-weight:700;border:none;border-radius:8px;background:var(--green);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:16px;transition:background .15s}
  .add-btn:hover:not(:disabled){background:var(--green-d)}
  .add-btn:disabled{opacity:.4;cursor:not-allowed}
  .list-header{display:flex;align-items:center;gap:8px;margin-bottom:14px}
  .list-title{font-size:14px;font-weight:700;color:var(--text)}
  .cnt{font-size:11px;padding:2px 10px;border-radius:99px;background:var(--green-l);color:var(--green-d);font-weight:700}
  .xl-btn{margin-left:auto;font-family:'Noto Sans JP',sans-serif;font-size:13px;font-weight:700;padding:7px 16px;border:none;border-radius:8px;background:var(--green);color:#fff;cursor:pointer;display:flex;align-items:center;gap:6px;transition:background .15s}
  .xl-btn:hover:not(:disabled){background:var(--green-d)}
  .xl-btn:disabled{opacity:.4;cursor:not-allowed}
  .table-wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th{background:var(--green);color:#fff;font-size:11px;font-weight:700;letter-spacing:.05em;padding:9px 8px;text-align:left;white-space:nowrap}
  th:first-child{border-radius:8px 0 0 0}
  th:last-child{border-radius:0 8px 0 0}
  td{padding:8px 8px;border-bottom:1px solid var(--border);white-space:nowrap;vertical-align:middle}
  tr:nth-child(even) td{background:var(--bg)}
  tr:last-child td{border-bottom:none}
  .mo-badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--green-l);color:var(--green-d)}
  .edit-row{font-size:11px;padding:3px 9px;border:1px solid #f5d88a;border-radius:6px;color:var(--amber);background:transparent;cursor:pointer;font-family:'Noto Sans JP',sans-serif;transition:background .12s;margin-right:4px}
  .edit-row:hover{background:var(--amber-l);border-color:var(--amber)}
  .del-row{font-size:11px;padding:3px 9px;border:1px solid #f0b8b4;border-radius:6px;color:var(--danger);background:transparent;cursor:pointer;font-family:'Noto Sans JP',sans-serif;transition:background .12s}
  .del-row:hover{background:var(--danger-l)}
  .empty{text-align:center;color:var(--text-t);padding:32px;font-size:13px}
  .mono{font-family:'IBM Plex Mono',monospace}
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:center;justify-content:center}
  .modal-overlay.open{display:flex}
  .modal{background:#fff;border-radius:14px;padding:24px;width:90%;max-width:340px}
  .modal h3{font-size:15px;font-weight:700;margin-bottom:16px;color:var(--text)}
  .modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
  .modal-btns{display:flex;gap:8px;justify-content:flex-end}
  .modal-cancel{font-family:'Noto Sans JP',sans-serif;font-size:13px;padding:8px 18px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--text-s);cursor:pointer}
  .modal-save{font-family:'Noto Sans JP',sans-serif;font-size:13px;font-weight:700;padding:8px 18px;border:none;border-radius:8px;background:var(--green);color:#fff;cursor:pointer}
  .modal-save:hover{background:var(--green-d)}
  @media(max-width:520px){.grid2{grid-template-columns:1fr}.full{grid-column:1}}
</style>
</head>
<body>
<header>
  <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-9 4 18 3-9h4"/></svg>
  <div>
    <h1>鳩山牧場　PRRS/CSF採血シート</h1>
    <p>母豚番号は任意入力</p>
  </div>
</header>

<div class="main">
  <div class="card">
    <div class="card-title">採血情報入力</div>
    <div class="grid2">

      <div class="fg full">
        <label>採血日</label>
        <input type="date" id="sdate" onchange="st.sd=this.value;chk()">
      </div>

      <div class="fg">
        <label>豚舎</label>
        <div class="btn-group">
          <button class="bs" onclick="sel(this,'barn','1号舎')">1号舎</button>
          <button class="bs" onclick="sel(this,'barn','2号舎')">2号舎</button>
        </div>
      </div>

      <div class="fg">
        <label>性別</label>
        <div class="btn-group">
          <button class="bs" onclick="sel(this,'sex','♀')">♀ 雌</button>
          <button class="bs" onclick="sel(this,'sex','♂')">♂ 雄</button>
        </div>
      </div>

      <div class="fg full">
        <label>豚房（N側 / S側）</label>
        <div style="display:flex;flex-direction:column;gap:8px">
          <div class="btn-group">
            <button class="bs" onclick="sel(this,'side','N側')">N側</button>
            <button class="bs" onclick="sel(this,'side','S側')">S側</button>
          </div>
          <div style="display:grid;grid-template-columns:repeat(6,1fr);gap:5px" id="pen-nums"></div>
          <div id="pen-sel-disp" style="font-size:13px;color:var(--text-t)">側・番号を選択してください</div>
        </div>
      </div>

      <div class="fg full">
        <label>品種</label>
        <div class="btn-group">
          <button class="bs" onclick="sel(this,'breed','W')">W</button>
          <button class="bs" onclick="sel(this,'breed','L')">L</button>
          <button class="bs" onclick="sel(this,'breed','D')">D</button>
          <button class="bs" onclick="sel(this,'breed','B')">B</button>
          <button class="bs" onclick="sel(this,'breed','WB')">WB</button>
          <button class="bs" onclick="sel(this,'breed','F1')">F1</button>
        </div>
      </div>

      <div class="fg">
        <div class="np-label">耳標番号</div>
        <div class="ear-disp" id="edisp"><span class="ear-ph">番号を入力</span></div>
        <div class="numpad">
          <button class="nb" onclick="np('ear','1')">1</button><button class="nb" onclick="np('ear','2')">2</button><button class="nb" onclick="np('ear','3')">3</button>
          <button class="nb" onclick="np('ear','4')">4</button><button class="nb" onclick="np('ear','5')">5</button><button class="nb" onclick="np('ear','6')">6</button>
          <button class="nb" onclick="np('ear','7')">7</button><button class="nb" onclick="np('ear','8')">8</button><button class="nb" onclick="np('ear','9')">9</button>
          <button class="nb del" onclick="np('ear','DEL')">⌫</button><button class="nb" onclick="np('ear','0')">0</button><button class="nb del" onclick="np('ear','CLR')" style="font-size:11px">CLR</button>
        </div>
      </div>

      <div class="fg">
        <div class="np-label">母豚番号（任意）</div>
        <div class="ear-disp" id="mdisp"><span class="ear-ph">番号を入力</span></div>
        <div class="numpad">
          <button class="nb" onclick="np('mot','1')">1</button><button class="nb" onclick="np('mot','2')">2</button><button class="nb" onclick="np('mot','3')">3</button>
          <button class="nb" onclick="np('mot','4')">4</button><button class="nb" onclick="np('mot','5')">5</button><button class="nb" onclick="np('mot','6')">6</button>
          <button class="nb" onclick="np('mot','7')">7</button><button class="nb" onclick="np('mot','8')">8</button><button class="nb" onclick="np('mot','9')">9</button>
          <button class="nb del" onclick="np('mot','DEL')">⌫</button><button class="nb" onclick="np('mot','0')">0</button><button class="nb del" onclick="np('mot','CLR')" style="font-size:11px">CLR</button>
        </div>
      </div>

      <div class="fg">
        <label>生年月日（月）</label>
        <select id="bdm" onchange="upAge()">
          <option value="">月</option>
          <option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option>
          <option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option>
          <option value="9">9</option><option value="10">10</option><option value="11">11</option><option value="12">12</option>
        </select>
      </div>

      <div class="fg">
        <label>生年月日（日）</label>
        <select id="bdd" onchange="upAge()"><option value="">日</option></select>
      </div>

      <div class="fg full" id="ainfo" style="display:none">
        <div id="abadge"></div>
      </div>
    </div>

    <button class="add-btn" id="addbtn" onclick="addRow()" disabled>＋ 行を追加</button>
  </div>

  <div class="card">
    <div class="list-header">
      <span class="list-title">採血リスト</span>
      <span class="cnt" id="cnt">0件</span>
      <button class="xl-btn" id="xlbtn" onclick="exportXL()" disabled>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/></svg>
        Excel出力
      </button>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th><th>採血日</th><th>豚舎</th><th>豚房</th><th>品種</th><th>性別</th><th>耳標番号</th><th>母豚番号</th><th>生年月日</th><th>月齢</th><th></th>
          </tr>
        </thead>
        <tbody id="tbody">
          <tr><td colspan="11" class="empty">まだデータがありません</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- 編集モーダル -->
<div class="modal-overlay" id="editModal">
  <div class="modal" style="max-width:420px">
    <h3>生年月日・母豚番号を編集</h3>
    <div style="display:flex;flex-direction:column;gap:16px;margin-bottom:20px">
      <div>
        <div class="np-label" style="margin-bottom:6px">生年月日</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:0">
          <div class="fg">
            <label>月</label>
            <select id="em-month">
              <option value="">月</option>
              <option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option>
              <option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option>
              <option value="9">9</option><option value="10">10</option><option value="11">11</option><option value="12">12</option>
            </select>
          </div>
          <div class="fg">
            <label>日</label>
            <select id="em-day"><option value="">日</option></select>
          </div>
        </div>
      </div>
      <div>
        <div class="np-label" style="margin-bottom:6px">母豚番号</div>
        <div class="ear-disp" id="em-mdisp" style="font-size:20px;min-height:44px;margin-bottom:8px"><span class="ear-ph">番号を入力</span></div>
        <div class="numpad" style="max-width:100%">
          <button class="nb" onclick="npe('1')">1</button><button class="nb" onclick="npe('2')">2</button><button class="nb" onclick="npe('3')">3</button>
          <button class="nb" onclick="npe('4')">4</button><button class="nb" onclick="npe('5')">5</button><button class="nb" onclick="npe('6')">6</button>
          <button class="nb" onclick="npe('7')">7</button><button class="nb" onclick="npe('8')">8</button><button class="nb" onclick="npe('9')">9</button>
          <button class="nb del" onclick="npe('DEL')">⌫</button><button class="nb" onclick="npe('0')">0</button><button class="nb del" onclick="npe('CLR')" style="font-size:11px">CLR</button>
        </div>
      </div>
    </div>
    <div class="modal-btns">
      <button class="modal-cancel" onclick="closeModal()">キャンセル</button>
      <button class="modal-save" onclick="saveEdit()">保存</button>
    </div>
  </div>
</div>

<script>
const st={sd:'',barn:'',pen:'',side:'',penNum:'',breed:'',sex:'',ear:'',mot:'',bm:'',bd:''};
const rows=[];
const today=new Date();
let editIdx=-1;

const sdEl=document.getElementById('sdate');
sdEl.value=today.toISOString().slice(0,10);
st.sd=sdEl.value;

const penNumsEl=document.getElementById('pen-nums');
for(let i=1;i<=23;i++){
  const b=document.createElement('button');
  b.className='bs pen-num';
  b.textContent=i;
  b.dataset.num=i;
  b.onclick=function(){
    document.querySelectorAll('.pen-num').forEach(x=>x.classList.remove('on'));
    this.classList.add('on');
    st.penNum=this.dataset.num;
    updatePen();
  };
  penNumsEl.appendChild(b);
}

function sel(btn,key,val){
  btn.closest('.btn-group').querySelectorAll('.bs').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  st[key]=val;
  if(key==='side') updatePen();
  chk();
}

function updatePen(){
  if(st.side&&st.penNum){
    st.pen=st.side+' '+st.penNum+'番';
    document.getElementById('pen-sel-disp').textContent=st.side+' '+st.penNum+'番';
    document.getElementById('pen-sel-disp').style.color='var(--text)';
  } else {
    st.pen='';
    document.getElementById('pen-sel-disp').textContent='側・番号を選択してください';
    document.getElementById('pen-sel-disp').style.color='var(--text-t)';
  }
  chk();
}

function np(target,v){
  if(target==='ear'){
    if(v==='DEL') st.ear=st.ear.slice(0,-1);
    else if(v==='CLR') st.ear='';
    else if(st.ear.length<10) st.ear+=v;
    document.getElementById('edisp').innerHTML=st.ear||'<span class="ear-ph">番号を入力</span>';
  } else {
    if(v==='DEL') st.mot=st.mot.slice(0,-1);
    else if(v==='CLR') st.mot='';
    else if(st.mot.length<10) st.mot+=v;
    document.getElementById('mdisp').innerHTML=st.mot||'<span class="ear-ph">番号を入力</span>';
  }
  chk();
}

function getDays(m){ return new Date(today.getFullYear(),m,0).getDate(); }

function buildDays(sel,month,selected){
  const days=getDays(month);
  sel.innerHTML='<option value="">日</option>';
  for(let i=1;i<=days;i++){
    const o=document.createElement('option');
    o.value=i;o.textContent=i;
    if(i===selected) o.selected=true;
    sel.appendChild(o);
  }
}

function upAge(){
  const m=parseInt(document.getElementById('bdm').value)||0;
  const de=document.getElementById('bdd');
  const prevDay=parseInt(de.value)||0;
  if(m){ buildDays(de,m,prevDay); }
  st.bm=document.getElementById('bdm').value;
  st.bd=document.getElementById('bdd').value;
  const info=document.getElementById('ainfo');
  if(st.bm&&st.bd){
    const ref=st.sd?new Date(st.sd):today;
    const bd=new Date(ref.getFullYear(),parseInt(st.bm)-1,parseInt(st.bd));
    if(bd>ref) bd.setFullYear(ref.getFullYear()-1);
    const mo=Math.floor((ref-bd)/(1000*60*60*24*30.44));
    info.style.display='';
    document.getElementById('abadge').innerHTML=`<span class="age-badge">生後${mo}か月</span>`;
  } else { info.style.display='none'; }
  chk();
}

function chk(){
  document.getElementById('addbtn').disabled=!(st.sd&&st.barn&&st.pen&&st.breed&&st.sex&&st.ear);
}

function calcRow(sdStr,bm,bday){
  const ref=new Date(sdStr);
  const bd=new Date(ref.getFullYear(),parseInt(bm)-1,parseInt(bday));
  if(bd>ref) bd.setFullYear(ref.getFullYear()-1);
  const mo=Math.floor((ref-bd)/(1000*60*60*24*30.44));
  const bdStr=`${bd.getFullYear()}/${String(bd.getMonth()+1).padStart(2,'0')}/${String(bd.getDate()).padStart(2,'0')}`;
  return {bdStr,mo};
}

function addRow(){
  let bdStr='', mo='';
  if(st.bm&&st.bd){ const r=calcRow(st.sd,st.bm,st.bd); bdStr=r.bdStr; mo=r.mo; }
  rows.push({sd:st.sd,barn:st.barn,pen:st.pen,breed:st.breed,sex:st.sex,
             ear:st.ear,mot:st.mot,bd:bdStr,bm:st.bm,bday:st.bd,mo});
  render();
  st.ear=''; st.mot='';
  document.getElementById('edisp').innerHTML='<span class="ear-ph">番号を入力</span>';
  document.getElementById('mdisp').innerHTML='<span class="ear-ph">番号を入力</span>';
  document.getElementById('addbtn').disabled=true;
}

function render(){
  const tb=document.getElementById('tbody');
  document.getElementById('cnt').textContent=rows.length+'件';
  document.getElementById('xlbtn').disabled=rows.length===0;
  if(!rows.length){
    tb.innerHTML='<tr><td colspan="11" class="empty">まだデータがありません</td></tr>';
    return;
  }
  tb.innerHTML=rows.map((r,i)=>`<tr>
    <td style="color:#999;font-size:11px">${i+1}</td>
    <td>${r.sd}</td><td>${r.barn}</td><td>${r.pen}</td>
    <td style="text-align:center">${r.breed}</td>
    <td style="text-align:center">${r.sex}</td>
    <td class="mono">${r.ear}</td>
    <td class="mono">${r.mot||'—'}</td>
    <td>${r.bd}</td>
    <td>${r.mo!==''?`<span class="mo-badge">${r.mo}か月</span>`:''}</td>
    <td style="white-space:nowrap">
      <button class="edit-row" onclick="openEdit(${i})">編集</button>
      <button class="del-row" onclick="delRow(${i})">削除</button>
    </td>
  </tr>`).join('');
}

function delRow(i){ rows.splice(i,1); render(); }

let editMot='';
function openEdit(i){
  editIdx=i;
  const r=rows[i];
  document.getElementById('em-month').value=r.bm||'';
  if(r.bm) buildDays(document.getElementById('em-day'),parseInt(r.bm),parseInt(r.bday)||0);
  else { document.getElementById('em-day').innerHTML='<option value="">日</option>'; }
  document.getElementById('em-day').value=r.bday||'';
  editMot=r.mot||'';
  document.getElementById('em-mdisp').innerHTML=editMot||'<span class="ear-ph">番号を入力</span>';
  document.getElementById('editModal').classList.add('open');
}

function closeModal(){
  editIdx=-1;
  document.getElementById('editModal').classList.remove('open');
}

function saveEdit(){
  const m=document.getElementById('em-month').value;
  const d=document.getElementById('em-day').value;
  if((m&&!d)||(d&&!m)){ alert('月と日を両方選択してください'); return; }
  const r=rows[editIdx];
  if(m&&d){
    const {bdStr,mo}=calcRow(r.sd,m,d);
    r.bm=m; r.bday=d; r.bd=bdStr; r.mo=mo;
  } else {
    r.bm=''; r.bday=''; r.bd=''; r.mo='';
  }
  r.mot=editMot;
  render();
  closeModal();
}

function npe(v){
  if(v==='DEL') editMot=editMot.slice(0,-1);
  else if(v==='CLR') editMot='';
  else if(editMot.length<10) editMot+=v;
  document.getElementById('em-mdisp').innerHTML=editMot||'<span class="ear-ph">番号を入力</span>';
}

document.getElementById('em-month').addEventListener('change',function(){
  const m=parseInt(this.value)||0;
  if(m){ buildDays(document.getElementById('em-day'),m,parseInt(document.getElementById('em-day').value)||0); }
});

document.getElementById('editModal').addEventListener('click',function(e){ if(e.target===this) closeModal(); });

async function exportXL(){
  if(!rows.length) return;
  const btn=document.getElementById('xlbtn');
  btn.disabled=true; btn.innerHTML='作成中...';
  try{
    const wb=new ExcelJS.Workbook();
    wb.creator='鳩山牧場'; wb.created=new Date();
    const ws=wb.addWorksheet('採血シート',{properties:{tabColor:{argb:'FF1D9E75'}}});
    const GREEN='FF1D9E75',GRAY='FFF5F5F3',WHITE='FFFFFFFF';
    const thin={style:'thin',color:{argb:'FFD0D0D0'}};
    const ab={top:thin,left:thin,bottom:thin,right:thin};

    ws.mergeCells('A1:K1');
    const t=ws.getCell('A1');
    t.value='鳩山牧場　PRRS/CSF採血シート';
    t.font={name:'Arial',size:14,bold:true,color:{argb:'FFFFFFFF'}};
    t.fill={type:'pattern',pattern:'solid',fgColor:{argb:GREEN}};
    t.alignment={horizontal:'center',vertical:'middle'};
    t.border=ab; ws.getRow(1).height=32;

    const hdrs=['#','採血日','豚舎','豚房','品種','性別','耳標番号','母豚番号','生年月日','月齢','備考'];
    const hr=ws.getRow(2);
    hdrs.forEach((h,i)=>{
      const c=hr.getCell(i+1);
      c.value=h; c.font={name:'Arial',size:11,bold:true,color:{argb:'FFFFFFFF'}};
      c.fill={type:'pattern',pattern:'solid',fgColor:{argb:GREEN}};
      c.alignment={horizontal:'center',vertical:'middle'}; c.border=ab;
    });
    hr.height=22;

    rows.forEach((r,i)=>{
      const alt=i%2===1?GRAY:WHITE;
      const dr=ws.getRow(i+3);
      const vals=[i+1,r.sd,r.barn,r.pen,r.breed,r.sex,r.ear,r.mot||'',r.bd,r.mo+'か月',''];
      vals.forEach((v,j)=>{
        const c=dr.getCell(j+1);
        c.value=v; c.font={name:'Arial',size:10};
        c.fill={type:'pattern',pattern:'solid',fgColor:{argb:alt}};
        c.alignment={horizontal:[0,2,4,5,9].includes(j)?'center':'left',vertical:'middle'};
        c.border=ab;
      });
      dr.height=18;
    });

    [5,14,9,16,8,7,14,12,14,9,14].forEach((w,i)=>{ws.getColumn(i+1).width=w;});
    ws.views=[{state:'frozen',ySplit:2}];
    const buf=await wb.xlsx.writeBuffer();
    const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=`採血シート_鳩山牧場_${rows[0].sd.replace(/-/g,'')}.xlsx`;
    a.click();
  }catch(e){ alert('Excel出力に失敗しました: '+e.message); }
  btn.disabled=false;
  btn.innerHTML='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/></svg> Excel出力';
}
</script>
